<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Notes · DOM & LocalStorage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ── Google Fonts ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />


  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg:      '#0e0e11',
            surface: '#18181d',
            border:  '#2a2a35',
            accent:  '#c8f135',
            accent2: '#8aff80',
            muted:   '#6b6b80',
            danger:  '#ff5f5f',
            txt:     '#e8e8ef',
          },
          fontFamily: {
            sans: ['Syne', 'sans-serif'],
            mono: ['DM Mono', 'monospace'],
          },
          keyframes: {
            slideIn: {
              '0%':   { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          },
          animation: {
            slideIn: 'slideIn 0.25s ease forwards',
          }
        }
      }
    }
  </script>

  <style>
    #inputNota:focus { outline: none; border-color: #c8f135; }

    #inputNota::placeholder { color: #6b6b80; }

    #btnAgregar:hover  { opacity: 0.88; }
    #btnAgregar:active { transform: scale(0.97); }

    .btn-eliminar:hover {
      color: #ff5f5f;
      border-color: #ff5f5f;
      background-color: rgba(255, 95, 95, 0.07);
    }

    #mensajeError          { opacity: 0; transition: opacity 0.2s; }
    #mensajeError.visible  { opacity: 1; }

    #estadoVacio           { display: none; }
    #estadoVacio.visible   { display: block; }
  </style>
</head>

<body class="bg-bg text-txt font-sans min-h-screen flex flex-col items-center px-5 py-16">

  <header class="text-center mb-12">

    <div class="inline-block font-mono text-[11px] tracking-[0.15em] uppercase
                text-accent border border-accent px-3 py-0.5 rounded-full mb-4">
      DOM &amp; LocalStorage
    </div>

    <h1 class="text-5xl font-extrabold leading-tight">
      My <span class="text-accent">Notes</span>
    </h1>

    <p class="mt-3 text-muted text-sm font-mono">
      Write a note, add it and reload it whenever you want.
    </p>

  </header>

  <div class="bg-surface border border-border rounded-2xl w-full max-w-[560px] p-8">

    <div class="flex gap-2.5 mb-2.5">

      <input
        type="text"
        id="inputNota"
        placeholder="Write a note…"
        maxlength="200"
        autocomplete="off"
        class="flex-1 bg-bg border border-border rounded-[10px] text-txt
               font-mono text-sm px-4 py-3 transition-colors duration-200"
      />

      <button
        id="btnAgregar"
        class="bg-accent text-bg font-sans font-semibold text-sm
               px-5 py-3 rounded-[10px] cursor-pointer whitespace-nowrap
               transition-all duration-200"
      >
        + Add Note
      </button>

    </div>

    
    <p id="mensajeError" class="font-mono text-xs text-danger min-h-[18px] mb-1">
      ⚠ The field cannot be empty.
    </p>

    <div class="flex justify-between items-center mt-4 mb-3">
      <span class="font-mono text-xs text-muted uppercase tracking-widest">
        Notes saved
      </span>
      <span id="contadorNotas" class="font-mono text-xs text-accent2 font-medium">
        0 notes
      </span>
    </div>
    <div id="estadoVacio" class="text-center py-10 font-mono text-sm text-muted">
      <span class="text-3xl block mb-2.5">🗒️</span>
      There are no notes yet. Add the first one!
    </div>

    <ul id="listaNotas" class="flex flex-col gap-2 list-none"></ul>

  </div>

  <footer class="mt-10 font-mono text-[11px] text-muted text-center">
    Keiner · Manipulación del DOM · 2025
  </footer>

  <script src="notes.js"></script>

</body>
</html>
